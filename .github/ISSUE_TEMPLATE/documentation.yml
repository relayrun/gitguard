name: Documentation or translation correction
description: Report an unclear instruction, broken link or translation problem.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Please keep examples public and remove private information. For a new feature idea, use Discussions Ideas.
  - type: dropdown
    id: language
    attributes:
      label: Affected language
      options:
        - English
        - 简体中文
        - 日本語
        - Deutsch
        - Français
        - Español
        - Português (Brasil)
        - Русский
        - Multiple languages / other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page and section
      description: Add a public link or repository-relative path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs correction?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction or supporting source
      description: If possible, explain the intended meaning or link to an official source.
