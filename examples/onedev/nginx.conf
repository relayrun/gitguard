# Included inside Nginx's http context. No tokens, queries or auth headers in logs.
log_format gitguard '$request_method $uri $status $upstream_status';
map $http_upgrade $gitguard_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout gitguard;
    client_max_body_size 0;

    # Optional policy: reject the reserved REST namespace for every HTTP method.
    # Keep this before other regex locations; validate URI variants for your version.
    location ~* ^/~api {
        add_header X-GitGuard-Gateway rest-blocked always;
        return 403;
    }
    location / {
        proxy_pass http://onedev:6610;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gitguard_connection;
    }
}
